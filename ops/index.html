<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#3562cc" />
    <title>Operaciones | shwcs</title>
    <style>
      :root { color-scheme: light; font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; background: #f5f5f4; color: #171717; }
      main { min-height: 100vh; display: grid; grid-template-columns: minmax(20rem, 42%) 1fr; }
      .brand { display: flex; min-height: 100vh; flex-direction: column; justify-content: space-between; background: #3562cc; padding: clamp(2rem, 5vw, 5rem); color: white; }
      .brand img { width: clamp(8rem, 13vw, 11rem); height: auto; }
      .eyebrow { margin: 0 0 1.5rem; color: rgba(255,255,255,.68); font-size: .78rem; font-weight: 700; letter-spacing: .2em; text-transform: uppercase; }
      h1 { max-width: 10ch; margin: 0; font-size: clamp(3rem, 7vw, 7.5rem); font-weight: 600; letter-spacing: -.065em; line-height: .94; }
      .brand small { color: rgba(255,255,255,.66); font-size: .9rem; }
      .content { display: flex; min-height: 100vh; align-items: center; padding: clamp(2rem, 8vw, 8rem); }
      .card { width: min(38rem, 100%); }
      .status { display: inline-flex; align-items: center; gap: .6rem; margin-bottom: 2rem; color: #6b6864; font-size: .9rem; }
      .dot { width: .55rem; height: .55rem; border-radius: 999px; background: #3562cc; box-shadow: 0 0 0 .35rem #e5ecff; }
      h2 { margin: 0 0 1.25rem; font-size: clamp(2.25rem, 4vw, 4.5rem); font-weight: 600; letter-spacing: -.055em; line-height: 1; }
      p { max-width: 35rem; margin: 0; color: #77726d; font-size: clamp(1rem, 1.4vw, 1.25rem); line-height: 1.65; }
      a { display: inline-flex; align-items: center; gap: .65rem; margin-top: 2.5rem; border-radius: 999px; background: #e3eaff; padding: .95rem 1.3rem; color: #2857c5; font-weight: 600; text-decoration: none; transition: transform .18s ease, box-shadow .18s ease; }
      a:hover { transform: translateY(-2px); box-shadow: 0 .75rem 2rem rgba(40,87,197,.14); }
      @media (max-width: 760px) { main { grid-template-columns: 1fr; } .brand { min-height: 44vh; } .content { min-height: 56vh; } h1 { max-width: 12ch; } }
    </style>
  </head>
  <body>
    <main>
      <section class="brand" aria-label="shwcs operaciones">
        <img src="/brand/shwcs-logo-white.png" alt="shwcs" />
        <div>
          <p class="eyebrow">Operaciones</p>
          <h1>Todo en su lugar.</h1>
        </div>
        <small>Acceso interno · shwcs</small>
      </section>
      <section class="content">
        <div class="card">
          <div class="status"><span class="dot"></span> Espacio independiente y restringido</div>
          <h2>El panel está en preparación.</h2>
          <p>Este dominio ya está separado de la plataforma pública. Aquí vivirá la revisión de proyectos, moderación, soporte y operación interna de shwcs.</p>
          <a href="https://shwcs.site">Volver a shwcs <span aria-hidden="true">→</span></a>
        </div>
      </section>
    </main>
  </body>
</html>
